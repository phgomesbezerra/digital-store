name: Importar fonte auditada
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Extrair pacote conferido
        run: |
          curl --fail --location --output /tmp/source.zip https://digital-store-pearl-three.vercel.app/source-import.zip
          python3 - <<'PY'
          import hashlib,zipfile,pathlib
          p=pathlib.Path('/tmp/source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'ae7117e580a2c64894f2c7921f0c8765bc72f93feae9f778bed6c080ddf9e3bc'
          with zipfile.ZipFile(p) as z:
              for name in z.namelist():
                  path=pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not any(x in path.parts for x in ('.git','.github','node_modules','dist','.env'))
              z.extractall('.')
          PY
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publicar projeto Digital Store auditado'
          git push origin HEAD:main
